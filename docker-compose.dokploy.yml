services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sga
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sga"]
      interval: 10s
      timeout: 5s
      retries: 8
    # Sem ports publicados: só a rede interna do Compose/Dokploy.

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/sga
      SECRET_KEY: ${SECRET_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://sgaes.tech}
      RUN_SEED: ${RUN_SEED:-true}
    depends_on:
      db:
        condition: service_healthy
    # Porta 8000 fica só na rede interna; o Traefik do Dokploy
    # aponta para o serviço web, que faz proxy de /api.

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    # Porta 80 interna — no Dokploy, Domains → service=web, port=80.

volumes:
  postgres_data:
