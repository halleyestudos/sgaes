services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sga
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sga"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    build:
      context: ./backend
      args:
        # força rebuild do entrypoint quando o compose muda
        CACHEBUST: "20260924a"
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://sgaes.tech}
      RUN_SEED: ${RUN_SEED:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    # Não bloqueia o front se o healthcheck da API demorar.
    depends_on:
      - api

volumes:
  postgres_data:
